name: Regenerate visual baselines
# Re-records Playwright visual baselines on the CI runner. Snapshots embed
# the host platform in their filename (e.g. `*-chromium-linux.png`) so
# the committed baselines are tied to the OS they were captured on.
# Trigger this workflow whenever you need to refresh the linux baselines
# that CI's `responsive-visuals` and `browser-functional` jobs consume,
# then open a PR from the resulting branch and merge it.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Record fresh visual baselines
        run: npx playwright test --project=chromium --update-snapshots
      - name: Push refreshed baselines to chore/refresh-visual-baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/refresh-visual-baselines
          git add tests/e2e/visual.spec.js-snapshots/
          git commit -m "chore: refresh visual baselines for ubuntu/chromium" || echo "No changes to commit"
          git push --force-with-lease origin chore/refresh-visual-baselines
